<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Librería Azul</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body>
  <section class="login" id="loginView"><form id="loginForm"><div class="logo">LA</div><p>Panel privado</p><h1>Librería Azul</h1><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><small id="loginError"></small><a href="/">← Volver a la tienda</a></form></section>
  <div class="dashboard" id="dashboard" hidden>
    <aside><div class="side-brand"><span>LA</span><strong>Librería Azul<small>Administración</small></strong></div><nav><button class="active" data-tab="products">Libros</button><button data-tab="settings">Tienda</button><a href="/" target="_blank">Ver sitio ↗</a></nav><button id="logout">Cerrar sesión</button></aside>
    <main>
      <header><div><p>Inventario y contenido</p><h1 id="pageTitle">Libros</h1></div><button class="primary" id="newProduct">+ Agregar libro</button></header>
      <section id="productsTab"><div class="stats" id="stats"></div><div class="toolbar"><input id="adminSearch" type="search" placeholder="Buscar por título o autor…"><span id="productCount"></span></div><div class="product-table" id="productTable"></div></section>
      <section id="settingsTab" hidden><form class="settings-form" id="settingsForm"><div class="form-grid"><label>Nombre de la tienda<input name="storeName"></label><label>WhatsApp con indicativo<input name="whatsapp"></label><label>Instagram<input name="instagram"></label><label>Horario<input name="hours"></label><label class="wide">Dirección<input name="address"></label><label class="wide">Anuncio superior<input name="announcement" placeholder="Envíos a toda Colombia · Asesoría por WhatsApp"></label><label class="wide">URL del logo oficial (opcional)<input name="logoUrl" placeholder="https://…"></label><label class="wide">Fotografía principal<input name="heroImage" placeholder="assets/foto.jpg o https://…"></label><label class="wide">Fotografía de historia<input name="storyImage" placeholder="assets/foto.jpg o https://…"></label><label>Envío base<input name="shippingBase" type="number"></label><label>Envío gratis desde<input name="freeShippingFrom" type="number"></label><label>Título recomendado<input name="recommendation"></label><label class="wide">Texto recomendado<textarea name="recommendationText"></textarea></label></div><button class="primary">Guardar cambios</button></form></section>
    </main>
  </div>
  <dialog id="productDialog"><form id="productForm"><div class="dialog-head"><div><small>CATÁLOGO</small><h2 id="dialogTitle">Nuevo libro</h2></div><button type="button" id="closeDialog">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>Título *<input name="title" required></label><label>Autor<input name="author"></label><label>Categoría<select name="category"><option>romance</option><option>misterio</option><option>juveniles</option><option>clasicos</option><option>poesia</option><option>motivacion</option></select></label><label>Emoción<select name="mood"><option value="enamorarme">Enamorarme</option><option value="desvelarme">Desvelarme</option><option value="sentir-bonito">Sentir bonito</option><option value="inspirarme">Inspirarme</option></select></label><label>Precio COP<input name="price" type="number" min="0" required></label><label>Existencias<input name="stock" type="number" min="0" required></label><label class="wide">URL o ruta de portada<input name="image" placeholder="https://… o assets/portada.jpg"></label><label>Estilo sin imagen<select name="coverClass"><option value="cover-blue">Azul</option><option value="cover-boulevard">Coral y azul</option><option value="cover-dracula">Negro clásico</option><option value="cover-sunset">Atardecer</option><option value="cover-stars">Estrellas</option><option value="cover-crown">Dorado</option><option value="cover-flower">Floral</option></select></label><label>Etiqueta<input name="badge" placeholder="Novedad"></label><label>Editorial<input name="publisher"></label><label>Páginas<input name="pages"></label><label>Formato<input name="format"></label><label class="wide">Sinopsis<textarea name="description" rows="4"></textarea></label><label class="check"><input name="featured" type="checkbox"> Destacado</label><label class="check"><input name="active" type="checkbox" checked> Visible en tienda</label></div><div class="dialog-actions"><button type="button" class="danger" id="deleteProduct" hidden>Eliminar</button><button class="primary">Guardar libro</button></div></form></dialog>
  <div class="notice" id="notice"></div><script src="admin.js"></script>
</body></html>
